name: "🐞 Documentation Bug"
description: "Report incorrect, outdated, or missing information in the documentation."
title: "[Bug]: "
labels:
  - documentation

body:
  - type: markdown
    attributes:
      value: |
        ## Documentation Bug Report

        Thank you for helping improve **Clash Verge Rev Omni Guide**.

        Use this template to report incorrect, outdated, or missing documentation.

  - type: input
    id: page
    attributes:
      label: Affected Page
      description: Which page or guide contains the problem?
      placeholder: "DNS Configuration Guide"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Select the affected documentation category.
      options:
        - Documentation
        - Guide
        - Tutorial
        - Configuration
        - FAQ
        - Troubleshooting
        - Performance
        - AI Services
        - DNS
        - TUN Mode
        - YAML
        - Other
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: Describe the Problem
      description: Explain what is incorrect or missing.
      placeholder: |
        Describe the issue clearly.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Content
      description: Describe what you expected to see.
      placeholder: |
        Explain the correct information.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Fix
      description: Describe how the documentation could be improved.
      placeholder: |
        Optional.
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References
      description: Provide links or references if available.
      placeholder: |
        Official documentation, screenshots, or other references.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I verified this issue before submitting.
          required: true

        - label: I searched existing Issues before creating this report.
          required: true
