name: "💬 Discussion"
description: "Start a community discussion, share ideas, ask questions, or exchange experiences about Clash Verge Rev."
title: "[Discussion]: "
labels:
  - discussion

body:
  - type: markdown
    attributes:
      value: |
        ## Community Discussion

        Welcome to the **Clash Verge Rev Omni Guide** community.

        Use this template to start discussions, share experiences, exchange ideas, recommend best practices, or ask non-support questions.

  - type: input
    id: discussion_title
    attributes:
      label: Discussion Title
      description: Enter a short and descriptive title.
      placeholder: "What Is Your Preferred DNS Configuration?"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Discussion Category
      description: Select the category that best matches your discussion.
      options:
        - General
        - Beginner Guide
        - Installation
        - Configuration
        - DNS
        - TUN Mode
        - Mihomo
        - YAML
        - Rule Providers
        - Proxy Groups
        - Fake-IP
        - Redir-Host
        - AI Services
        - Streaming
        - Performance
        - Security
        - Tips & Tricks
        - Best Practices
        - Community Resources
        - Other
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: Background
      description: Explain the background or reason for this discussion.
      placeholder: |
        Describe why you started this discussion and what you hope to learn.
    validations:
      required: true

  - type: textarea
    id: discussion
    attributes:
      label: Discussion Content
      description: Share your ideas, experiences, or questions.
      placeholder: |
        Share your thoughts, experience, comparison, or recommendations.

        You may include:
        - Personal experience
        - Configuration examples
        - Questions
        - Suggestions
        - Best practices
    validations:
      required: true

  - type: textarea
    id: community_questions
    attributes:
      label: Questions for the Community
      description: Ask questions that invite others to participate.
      placeholder: |
        Example:
        - Which DNS provider do you recommend?
        - Fake-IP or Redir-Host?
        - Which Rule Providers are you using?
    validations:
      required: false

  - type: textarea
    id: conclusion
    attributes:
      label: Your Opinion
      description: Share your current conclusion or recommendation.
      placeholder: |
        Explain what works best for you and why.
    validations:
      required: false

  - type: textarea
    id: related_docs
    attributes:
      label: Related Documentation
      description: List related guides or documentation.
      placeholder: |
        - DNS Guide
        - FAQ
        - Performance Guide
        - Troubleshooting
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing discussions before creating this one.
          required: true

        - label: This discussion is related to Clash Verge Rev or Mihomo.
          required: true

        - label: I agree to follow the project's Code of Conduct.
          required: true
