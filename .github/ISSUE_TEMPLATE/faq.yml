name: "❓ FAQ"
description: "Add or improve frequently asked questions for Clash Verge Rev Omni Guide."
title: "[FAQ]: "
labels:
  - faq

body:
  - type: markdown
    attributes:
      value: |
        ## Frequently Asked Questions

        Thank you for contributing to **Clash Verge Rev Omni Guide**.

        Use this template to document common questions and provide clear, accurate answers that help users quickly solve problems.

  - type: input
    id: question
    attributes:
      label: Frequently Asked Question
      description: Enter the question.
      placeholder: "Why are my Proxy Groups empty?"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Select the FAQ category.
      options:
        - Installation
        - Getting Started
        - Subscription
        - DNS
        - TUN Mode
        - Mihomo
        - YAML
        - Rule Providers
        - Proxy Groups
        - Fake-IP
        - Redir-Host
        - AI Services
        - Streaming
        - Performance
        - Security
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: short_answer
    attributes:
      label: Short Answer
      description: Provide a concise answer.
      placeholder: |
        Briefly answer the question in one or two sentences.
    validations:
      required: true

  - type: textarea
    id: detailed_answer
    attributes:
      label: Detailed Explanation
      description: Explain the answer in more detail.
      placeholder: |
        Explain why this happens and how users can resolve it.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Recommended Solution
      description: Provide recommended steps or best practices.
      placeholder: |
        Step 1

        Step 2

        Step 3
    validations:
      required: true

  - type: textarea
    id: related_docs
    attributes:
      label: Related Documentation
      description: List related documentation or guides.
      placeholder: |
        - Installation Guide
        - DNS Configuration
        - Troubleshooting
        - Performance Guide
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Optional tips or compatibility notes.
      placeholder: |
        Add any extra recommendations or notes.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I confirmed this is a frequently asked question.
          required: true

        - label: The answer has been verified.
          required: true

        - label: The information is clear and easy to understand.
          required: true
