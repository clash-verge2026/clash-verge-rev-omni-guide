name: "❓ FAQ"
description: "Add or improve frequently asked questions for Clash Verge Rev Omni Guide."
title: "[FAQ]: "
labels:
  - faq

body:
  - type: markdown
    attributes:
      value: |
        # ❓ Frequently Asked Questions

        Thank you for contributing to the FAQ section.

        This template is intended for documenting common questions and clear answers to help users quickly resolve issues.

  - type: input
    id: question
    attributes:
      label: Frequently Asked Question
      description: Enter the question users commonly ask.
      placeholder: Example: Why are my Proxy Groups empty?
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: FAQ Category
      description: Select the category that best matches this question.
      options:
        - Installation
        - Beginner Guide
        - Subscription
        - DNS
        - Fake-IP
        - Redir-Host
        - TUN Mode
        - Mihomo
        - YAML
        - Rule Providers
        - Proxy Groups
        - Performance
        - AI Services
        - Streaming
        - Troubleshooting
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: short_answer
    attributes:
      label: Short Answer
      description: Provide a concise answer.
      placeholder: Briefly answer the question.
    validations:
      required: true

  - type: textarea
    id: detailed_explanation
    attributes:
      label: Detailed Explanation
      description: Explain the answer in detail.
      placeholder: Describe the reason, background, and solution.
    validations:
      required: true

  - type: textarea
    id: recommended_solution
    attributes:
      label: Recommended Solution
      description: List recommended steps or best practices.
      placeholder: |
        Step 1

        Step 2

        Step 3
    validations:
      required: true

  - type: textarea
    id: related_guides
    attributes:
      label: Related Guides
      description: Link to related documentation.
      placeholder: |
        - DNS Configuration Guide
        - TUN Mode Guide
        - Performance Guide
        - Troubleshooting Collection
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Add any useful tips or references.
      placeholder: Optional notes.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I confirmed this is a frequently asked question.
          required: true

        - label: The answer has been verified.
          required: true

        - label: The explanation is clear and easy to understand.
          required: true

        - label: Related documentation has been referenced where appropriate.
          required: false
