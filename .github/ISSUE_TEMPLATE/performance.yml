name: "⚡ Performance"
description: "Share performance optimizations, benchmarks, and best practices for Clash Verge Rev."
title: "[Performance]: "
labels:
  - performance

body:
  - type: markdown
    attributes:
      value: |
        ## Performance Optimization

        Thank you for contributing to **Clash Verge Rev Omni Guide**.

        Use this template to document performance improvements, optimization techniques, benchmark results, and best practices.

  - type: input
    id: optimization_title
    attributes:
      label: Optimization Title
      description: Enter a short and descriptive title.
      placeholder: "Optimize DNS Performance"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Optimization Category
      description: Select the optimization category.
      options:
        - Startup
        - DNS
        - TUN Mode
        - Mihomo
        - YAML
        - Rule Providers
        - Proxy Groups
        - Fake-IP
        - Redir-Host
        - AI Services
        - Streaming
        - Memory Usage
        - CPU Usage
        - Network
        - Security
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Select the target platform.
      options:
        - Windows
        - macOS
        - Linux
        - Cross-platform
    validations:
      required: true

  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: Briefly describe this optimization.
      placeholder: |
        Explain what this optimization improves and when it should be used.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Test Environment
      description: Describe the environment used for testing.
      placeholder: |
        Clash Verge Rev Version:
        Mihomo Version:
        Operating System:
        CPU:
        Memory:
    validations:
      required: true

  - type: textarea
    id: optimization_steps
    attributes:
      label: Optimization Steps
      description: Describe the optimization process.
      placeholder: |
        Step 1

        Step 2

        Step 3
    validations:
      required: true

  - type: textarea
    id: benchmark
    attributes:
      label: Benchmark Results
      description: Share benchmark results or before-and-after comparisons.
      placeholder: |
        Before:
        Startup Time:
        CPU Usage:
        Memory Usage:

        After:
        Startup Time:
        CPU Usage:
        Memory Usage:
    validations:
      required: false

  - type: textarea
    id: benefits
    attributes:
      label: Expected Benefits
      description: Describe the expected improvements.
      placeholder: |
        - Faster startup
        - Lower memory usage
        - Reduced CPU usage
        - Better DNS response
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Optional recommendations, limitations, or compatibility notes.
      placeholder: |
        Add any additional information that may help other users.
    validations:
      required: false

  - type: textarea
    id: related_docs
    attributes:
      label: Related Documentation
      description: List related guides or documentation.
      placeholder: |
        - Performance Guide
        - DNS Configuration
        - FAQ
        - Troubleshooting
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I tested this optimization before submitting.
          required: true

        - label: The benchmark results are accurate.
          required: true

        - label: The optimization can be reproduced by other users.
          required: true
