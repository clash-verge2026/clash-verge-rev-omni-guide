name: "⚡ Performance"
description: "Share performance optimization guides, benchmarks, and best practices for Clash Verge Rev."
title: "[Performance]: "
labels:
  - performance

body:
  - type: markdown
    attributes:
      value: |
        ## Performance Optimization

        Thank you for contributing to **Clash Verge Rev Omni Guide**.

        Performance articles should explain optimization techniques, benchmark results, and recommended best practices.

  - type: input
    id: performance_title
    attributes:
      label: Performance Title
      description: Enter a short and descriptive title.
      placeholder: "Example: Optimize Startup Speed"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Performance Category
      description: Select the optimization category.
      options:
        - Startup Speed
        - Memory Usage
        - CPU Usage
        - DNS
        - TUN Mode
        - Mihomo
        - YAML
        - Rule Providers
        - Proxy Groups
        - AI Services
        - Streaming
        - Network
        - Security
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Select the target platform.
      options:
        - Windows
        - macOS
        - Linux
        - Cross-platform
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Target Audience
      description: Who is this optimization guide intended for?
      options:
        - Beginner
        - Intermediate
        - Advanced
        - All Users
    validations:
      required: true

  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: Briefly describe the optimization topic.
      placeholder: |
        Explain why this optimization is useful and when users should apply it.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Test Environment
      description: Describe the testing environment.
      placeholder: |
        Operating System:
        Clash Verge Rev Version:
        Mihomo Version:
        CPU:
        Memory:
        Configuration Size:
    validations:
      required: false

  - type: textarea
    id: current_status
    attributes:
      label: Current Performance
      description: Describe the current performance before optimization.
      placeholder: |
        Example:
        - Startup takes 8 seconds.
        - Memory usage is 300 MB.
        - CPU spikes during rule updates.
    validations:
      required: true

  - type: textarea
    id: optimization
    attributes:
      label: Optimization Steps
      description: Describe the optimization process.
      placeholder: |
        Step 1

        Step 2

        Step 3

        Step 4
    validations:
      required: true

  - type: textarea
    id: benchmark
    attributes:
      label: Benchmark Results
      description: Compare performance before and after optimization.
      placeholder: |
        Before:
        Startup: 8s
        Memory: 300MB

        After:
        Startup: 3s
        Memory: 180MB
    validations:
      required: false

  - type: textarea
    id: best_practices
    attributes:
      label: Best Practices
      description: Share recommendations for maintaining good performance.
      placeholder: |
        - Keep Mihomo updated.
        - Remove unused subscriptions.
        - Minimize unnecessary rule providers.
        - Clean old profiles regularly.
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected Result
      description: What improvements should users expect?
      placeholder: |
        Example:
        - Faster startup.
        - Lower memory usage.
        - Better DNS response.
        - Improved stability.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How can users verify the optimization worked?
      placeholder: |
        Example:
        - Measure startup time.
        - Monitor memory usage.
        - Test DNS latency.
    validations:
      required: true

  - type: textarea
    id: related_docs
    attributes:
      label: Related Documentation
      description: List related guides or resources.
      placeholder: |
        - DNS Guide
        - Configuration Guide
        - Troubleshooting Guide
        - FAQ
    validations:
      required: false

  - type: textarea
    id: changelog
    attributes:
      label: Changelog
      description: Record updates to this optimization guide.
      placeholder: |
        v1.0
        - Initial version
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I tested these optimization steps before submitting.
          required: true

        - label: The benchmark results are accurate.
          required: true

        - label: The guide is written in Markdown format.
          required: true

        - label: The recommendations are practical and reproducible.
          required: true
