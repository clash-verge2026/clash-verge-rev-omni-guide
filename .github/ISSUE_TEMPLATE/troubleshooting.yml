name: "🛠 Troubleshooting"
description: "Report or document troubleshooting steps for Clash Verge Rev."
title: "[Troubleshooting]: "
labels:
  - troubleshooting

body:
  - type: markdown
    attributes:
      value: |
        ## Troubleshooting Guide

        Thank you for contributing to **Clash Verge Rev Omni Guide**.

        Troubleshooting articles should clearly describe the problem, explain possible causes, and provide step-by-step solutions.

  - type: input
    id: issue_title
    attributes:
      label: Issue Title
      description: Enter a short and descriptive issue title.
      placeholder: "Example: Proxy Groups Are Empty"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Select the affected component.
      options:
        - Installation
        - Subscription
        - Configuration
        - DNS
        - TUN Mode
        - Mihomo
        - YAML
        - Rule Providers
        - Proxy Groups
        - Fake-IP
        - Redir-Host
        - Performance
        - AI Services
        - Streaming
        - Network
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Select the affected platform.
      options:
        - Windows
        - macOS
        - Linux
        - Cross-platform
    validations:
      required: true

  - type: textarea
    id: symptoms
    attributes:
      label: Symptoms
      description: Describe what users are experiencing.
      placeholder: |
        Example:
        - Proxy Groups are empty.
        - No Internet connection.
        - Subscription cannot be updated.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Describe the environment where the issue occurs.
      placeholder: |
        Clash Verge Rev Version:
        Mihomo Version:
        Operating System:
        Configuration Type:
    validations:
      required: false

  - type: textarea
    id: causes
    attributes:
      label: Possible Causes
      description: List possible reasons for the issue.
      placeholder: |
        Example:
        - Invalid subscription URL
        - DNS configuration error
        - Firewall blocking connections
    validations:
      required: true

  - type: textarea
    id: diagnosis
    attributes:
      label: Diagnostic Steps
      description: Explain how to identify the root cause.
      placeholder: |
        Step 1

        Step 2

        Step 3
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solution
      description: Provide detailed steps to resolve the issue.
      placeholder: |
        Step 1

        Step 2

        Step 3
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How can users confirm the issue has been resolved?
      placeholder: |
        Example:
        - Proxy Groups display normally.
        - DNS resolves correctly.
        - Internet connection is restored.
    validations:
      required: true

  - type: textarea
    id: prevention
    attributes:
      label: Prevention
      description: Share recommendations to avoid this issue in the future.
      placeholder: |
        Example:
        - Keep subscriptions updated.
        - Verify DNS settings regularly.
        - Update Mihomo to the latest version.
    validations:
      required: false

  - type: textarea
    id: related_docs
    attributes:
      label: Related Documentation
      description: List related guides or documentation.
      placeholder: |
        - Configuration Guide
        - DNS Guide
        - FAQ
        - Performance Guide
    validations:
      required: false

  - type: textarea
    id: changelog
    attributes:
      label: Changelog
      description: Record updates to this troubleshooting article.
      placeholder: |
        v1.0
        - Initial version
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I verified this troubleshooting process before submitting.
          required: true

        - label: The solution has been tested successfully.
          required: true

        - label: The troubleshooting steps are clear and reproducible.
          required: true

        - label: The content is written in Markdown format.
          required: true
