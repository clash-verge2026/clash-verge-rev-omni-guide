name: "🛠️ Troubleshooting"
description: "Report or document common issues and provide troubleshooting steps for Clash Verge Rev."
title: "[Troubleshooting]: "
labels:
  - troubleshooting

body:
  - type: markdown
    attributes:
      value: |
        ## Troubleshooting Guide

        Thank you for helping improve **Clash Verge Rev Omni Guide**.

        This template is used to document common problems, their causes, and practical solutions.

  - type: input
    id: issue_title
    attributes:
      label: Issue Title
      description: Enter a short and descriptive title.
      placeholder: "TUN Mode Cannot Be Enabled"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Issue Category
      description: Select the category that best matches the problem.
      options:
        - Installation
        - Startup
        - Subscription
        - DNS
        - TUN Mode
        - Mihomo
        - YAML
        - Rule Providers
        - Proxy Groups
        - Network
        - Performance
        - AI Services
        - Streaming
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Select the affected operating system.
      options:
        - Windows
        - macOS
        - Linux
        - Cross-platform
    validations:
      required: true

  - type: textarea
    id: symptoms
    attributes:
      label: Problem Description
      description: Describe the problem you encountered.
      placeholder: |
        Example:
        - TUN Mode cannot be enabled.
        - Proxy Groups are empty.
        - DNS resolution fails.
    validations:
      required: true

  - type: textarea
    id: possible_causes
    attributes:
      label: Possible Causes
      description: List the possible reasons for this issue.
      placeholder: |
        Example:
        - Administrator permission is missing.
        - Invalid subscription.
        - DNS configuration error.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solution
      description: Explain how to solve the issue step by step.
      placeholder: |
        Step 1

        Step 2

        Step 3
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Explain how users can confirm the issue has been resolved.
      placeholder: |
        Example:
        - TUN Mode is enabled successfully.
        - Internet connection works normally.
        - Proxy traffic is routed correctly.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: Related Documentation
      description: Optional links to guides or documentation.
      placeholder: |
        - TUN Mode Guide
        - DNS Configuration
        - FAQ
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I verified this solution before submitting.
          required: true

        - label: The troubleshooting steps are complete.
          required: true

        - label: The information is accurate.
          required: true
