name: "⚙️ Configuration"
description: "Share configuration guides, examples, and best practices for Clash Verge Rev."
title: "[Configuration]: "
labels:
  - configuration

body:
  - type: markdown
    attributes:
      value: |
        ## Configuration Guide

        Thank you for contributing to **Clash Verge Rev Omni Guide**.

        Configuration Issues should include practical examples, explanations, and best practices.

  - type: input
    id: config_title
    attributes:
      label: Configuration Title
      description: Enter a short and descriptive title.
      placeholder: "Example: DNS Configuration Best Practices"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Configuration Category
      description: Select the configuration category.
      options:
        - DNS
        - TUN Mode
        - Mihomo
        - YAML
        - Rule Providers
        - Proxy Groups
        - Fake-IP
        - Redir-Host
        - AI Services
        - Streaming
        - Performance
        - Security
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Select the target platform.
      options:
        - Windows
        - macOS
        - Linux
        - Cross-platform
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Target Audience
      description: Who is this configuration intended for?
      options:
        - Beginner
        - Intermediate
        - Advanced
        - All Users
    validations:
      required: true

  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: Briefly describe this configuration.
      placeholder: |
        Explain the purpose, use case, and benefits.
    validations:
      required: true

  - type: textarea
    id: prerequisites
    attributes:
      label: Prerequisites
      description: What should users prepare before using this configuration?
      placeholder: |
        Example:
        - Clash Verge Rev installed
        - Mihomo Core
        - Subscription URL
    validations:
      required: false

  - type: textarea
    id: configuration
    attributes:
      label: Configuration Example
      description: Paste your YAML or configuration example.
      render: yaml
      placeholder: |
        dns:
          enable: true
          enhanced-mode: fake-ip
    validations:
      required: true

  - type: textarea
    id: explanation
    attributes:
      label: Configuration Explanation
      description: Explain each important option.
      placeholder: |
        Describe what each parameter does and why it is recommended.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification Steps
      description: How can users verify that the configuration works?
      placeholder: |
        Step 1

        Step 2

        Step 3
    validations:
      required: true

  - type: textarea
    id: common_problems
    attributes:
      label: Common Problems
      description: Describe common issues and their solutions.
      placeholder: |
        Problem:

        Cause:

        Solution:
    validations:
      required: false

  - type: textarea
    id: best_practices
    attributes:
      label: Best Practices
      description: Share recommendations and optimization tips.
      placeholder: |
        - Keep Mihomo updated.
        - Use trusted DNS providers.
        - Test latency regularly.
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected Result
      description: What should users achieve after applying this configuration?
      placeholder: |
        Users should be able to:
        - Resolve DNS correctly.
        - Improve connection stability.
        - Access AI services.
    validations:
      required: true

  - type: textarea
    id: related_docs
    attributes:
      label: Related Documentation
      description: List related guides or resources.
      placeholder: |
        - DNS Guide
        - FAQ
        - Performance Guide
        - TUN Mode Guide
    validations:
      required: false

  - type: textarea
    id: changelog
    attributes:
      label: Changelog
      description: Record updates to this configuration.
      placeholder: |
        v1.0
        - Initial version
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I tested this configuration before submitting.
          required: true

        - label: The configuration is accurate and complete.
          required: true

        - label: The configuration is compatible with Clash Verge Rev.
          required: true

        - label: The YAML syntax has been validated.
          required: true
