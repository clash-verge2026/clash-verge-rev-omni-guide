name: "⚙️ Configuration"
description: "Share configuration examples, best practices, and setup recommendations for Clash Verge Rev."
title: "[Configuration]: "
labels:
  - configuration

body:
  - type: markdown
    attributes:
      value: |
        ## Configuration Contribution

        Thank you for contributing configuration examples to **Clash Verge Rev Omni Guide**.

        Please provide clear explanations and practical examples that other users can easily follow.

  - type: input
    id: config_title
    attributes:
      label: Configuration Title
      description: Enter a short and descriptive title.
      placeholder: "DNS Configuration for Clash Verge Rev"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Configuration Category
      description: Select the configuration category.
      options:
        - DNS
        - TUN Mode
        - Mihomo
        - YAML
        - Rule Providers
        - Proxy Groups
        - Fake-IP
        - Redir-Host
        - AI Services
        - Streaming
        - Performance
        - Security
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Select the target platform.
      options:
        - Windows
        - macOS
        - Linux
        - Cross-platform
    validations:
      required: true

  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: Briefly explain this configuration.
      placeholder: |
        Describe what this configuration is used for and when it should be applied.
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Configuration Example
      description: Paste the configuration or explain the setup process.
      render: yaml
      placeholder: |
        dns:
          enable: true
          enhanced-mode: fake-ip
    validations:
      required: true

  - type: textarea
    id: explanation
    attributes:
      label: Configuration Explanation
      description: Explain each important option or setting.
      placeholder: |
        Describe what each configuration item does and why it is recommended.
    validations:
      required: true

  - type: textarea
    id: expected_result
    attributes:
      label: Expected Result
      description: Describe the expected behavior after applying this configuration.
      placeholder: |
        Example:
        - DNS resolution is faster.
        - Streaming services work correctly.
        - AI services can be accessed normally.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Optional recommendations, compatibility notes, or warnings.
      placeholder: |
        Mention any version requirements, limitations, or best practices.
    validations:
      required: false

  - type: textarea
    id: related_guides
    attributes:
      label: Related Documentation
      description: List related guides or documentation.
      placeholder: |
        - DNS Guide
        - TUN Mode Guide
        - FAQ
        - Troubleshooting
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I tested this configuration before submitting.
          required: true

        - label: The configuration is accurate and complete.
          required: true

        - label: The configuration is compatible with Clash Verge Rev.
          required: true
