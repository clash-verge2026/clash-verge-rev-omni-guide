name: "📖 Guide"
description: "Create a comprehensive guide for Clash Verge Rev Omni Guide."
title: "[Guide]: "
labels:
  - guide

body:
  - type: markdown
    attributes:
      value: |
        ## Guide Contribution

        Thank you for contributing a guide to **Clash Verge Rev Omni Guide**.

        Please provide clear, step-by-step instructions so users can easily follow along.

  - type: input
    id: guide_title
    attributes:
      label: Guide Title
      description: Enter the title of this guide.
      placeholder: "Enable TUN Mode on Windows"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Guide Category
      description: Select the most appropriate category.
      options:
        - Installation
        - DNS
        - TUN Mode
        - Mihomo
        - YAML
        - Rule Providers
        - Proxy Groups
        - AI Services
        - Streaming
        - Security
        - Performance
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Select the target platform.
      options:
        - Windows
        - macOS
        - Linux
        - Cross-platform
        - Other
    validations:
      required: true

  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: Briefly describe what this guide covers.
      placeholder: |
        Explain the purpose of this guide.
    validations:
      required: true

  - type: textarea
    id: prerequisites
    attributes:
      label: Prerequisites
      description: List any requirements before getting started.
      placeholder: |
        Example:
        - Clash Verge Rev installed
        - Administrator permission
        - Valid subscription
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Step-by-Step Guide
      description: Write detailed instructions.
      placeholder: |
        Step 1

        Step 2

        Step 3
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Explain how users can verify the guide was completed successfully.
      placeholder: |
        Describe the expected result.
    validations:
      required: true

  - type: textarea
    id: troubleshooting
    attributes:
      label: Common Problems
      description: List common issues and solutions.
      placeholder: |
        Problem:
        Solution:
    validations:
      required: false

  - type: textarea
    id: related
    attributes:
      label: Related Documentation
      description: List related guides or documentation.
      placeholder: |
        - DNS Configuration Guide
        - FAQ
        - Performance Guide
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I verified this guide before submitting.
          required: true

        - label: The guide contains complete steps.
          required: true

        - label: The guide is written in Markdown format.
          required: true
