name: "📖 Guide"
description: "Create a comprehensive guide for Clash Verge Rev Omni Guide."
title: "[Guide]: "
labels:
  - guide

body:
  - type: markdown
    attributes:
      value: |
        ## Guide Contribution

        Thank you for contributing to **Clash Verge Rev Omni Guide**.

        Guides explain concepts, best practices, and recommended workflows. Please provide clear explanations and practical examples.

  - type: input
    id: guide_title
    attributes:
      label: Guide Title
      description: Enter a short and descriptive guide title.
      placeholder: "Example: Understanding Rule Providers"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Select the guide category.
      options:
        - Installation
        - Configuration
        - DNS
        - TUN Mode
        - Mihomo
        - YAML
        - Rule Providers
        - Proxy Groups
        - Fake-IP
        - Redir-Host
        - AI Services
        - Performance
        - Security
        - Networking
        - Other
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Target Audience
      description: Who is this guide intended for?
      options:
        - Beginner
        - Intermediate
        - Advanced
        - All Users
    validations:
      required: true

  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: Briefly describe this guide.
      placeholder: |
        Explain what this guide covers and why it is useful.
    validations:
      required: true

  - type: textarea
    id: objectives
    attributes:
      label: Objectives
      description: What will readers learn?
      placeholder: |
        Example:
        - Understand the feature.
        - Learn recommended practices.
        - Avoid common mistakes.
    validations:
      required: true

  - type: textarea
    id: prerequisites
    attributes:
      label: Prerequisites
      description: What should readers prepare before following this guide?
      placeholder: |
        Example:
        - Clash Verge Rev installed
        - Mihomo Core
        - Basic YAML knowledge
    validations:
      required: false

  - type: textarea
    id: content
    attributes:
      label: Guide Content
      description: Write the complete guide.
      placeholder: |
        # Overview

        ## Background

        ## Key Concepts

        ## Recommended Workflow

        ## Best Practices

        ## Common Mistakes

        ## FAQ

        ## Conclusion
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: Provide configuration examples or practical use cases.
      placeholder: |
        Example 1

        Example 2

        Example 3
    validations:
      required: false

  - type: textarea
    id: best_practices
    attributes:
      label: Best Practices
      description: Share recommendations and optimization tips.
      placeholder: |
        - Keep Mihomo updated.
        - Use verified configuration examples.
        - Regularly update rule providers.
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected Outcome
      description: What should readers be able to do after reading this guide?
      placeholder: |
        Example:
        - Understand Rule Providers.
        - Configure DNS correctly.
        - Troubleshoot common issues.
    validations:
      required: true

  - type: textarea
    id: related_docs
    attributes:
      label: Related Documentation
      description: List related guides or resources.
      placeholder: |
        - Installation Guide
        - Configuration Guide
        - FAQ
        - Performance Guide
    validations:
      required: false

  - type: textarea
    id: changelog
    attributes:
      label: Changelog
      description: Record updates to this guide.
      placeholder: |
        v1.0
        - Initial version
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I reviewed existing documentation before creating this guide.
          required: true

        - label: The guide is technically accurate.
          required: true

        - label: The content follows Markdown formatting.
          required: true

        - label: Practical examples have been included where appropriate.
          required: true
