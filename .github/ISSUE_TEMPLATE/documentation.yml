name: "📚 Documentation"
description: "Create or improve documentation for Clash Verge Rev Omni Guide."
title: "[Documentation]: "
labels: ["documentation"]

body:
  - type: markdown
    attributes:
      value: |
        ## Documentation Contribution

        Thank you for helping improve **Clash Verge Rev Omni Guide**.

        Please complete the information below before submitting.

  - type: input
    id: title
    attributes:
      label: Documentation Title
      description: Enter a short and descriptive title.
      placeholder: Example: DNS Configuration Guide
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Select the documentation category.
      options:
        - Installation
        - Getting Started
        - Configuration
        - DNS
        - TUN Mode
        - Mihomo
        - YAML
        - FAQ
        - Troubleshooting
        - Performance
        - AI Services
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe this documentation.
      placeholder: Explain what this document covers.
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: Documentation Content
      description: Write the documentation or describe the proposed improvement.
      placeholder: |
        ## Overview

        ## Steps

        ## Notes

        ## References
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Optional links to official documentation or related resources.
      placeholder: Add related links if available.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing Issues before creating this documentation.
          required: true

        - label: The information has been verified.
          required: true

        - label: The content is written in Markdown format.
          required: true
