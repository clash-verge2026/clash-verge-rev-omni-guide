name: "📚 Documentation"
description: "Create or improve documentation for Clash Verge Rev Omni Guide."
title: "[Documentation]: "
labels:
  - documentation

body:
  - type: markdown
    attributes:
      value: |
        ## Documentation Contribution

        Thank you for helping improve **Clash Verge Rev Omni Guide**.

        Documentation Issues are designed as structured knowledge articles. Please provide clear, accurate, and well-organized content.

  - type: input
    id: title
    attributes:
      label: Documentation Title
      description: Enter a short and descriptive title.
      placeholder: "Example: DNS Configuration Guide"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Select the documentation category.
      options:
        - Installation
        - Getting Started
        - Configuration
        - DNS
        - TUN Mode
        - Mihomo
        - YAML
        - Rule Providers
        - Performance
        - AI Services
        - FAQ
        - Troubleshooting
        - Repository
        - Community
        - Other
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Target Audience
      description: Who is this documentation intended for?
      options:
        - Beginner
        - Intermediate
        - Advanced
        - All Users
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe this documentation.
      placeholder: |
        Explain what readers will learn from this document.
    validations:
      required: true

  - type: textarea
    id: objectives
    attributes:
      label: Objectives
      description: What are the goals of this documentation?
      placeholder: |
        Example:
        - Explain the feature.
        - Provide configuration examples.
        - Help users avoid common mistakes.
    validations:
      required: true

  - type: textarea
    id: prerequisites
    attributes:
      label: Prerequisites
      description: What should readers prepare before following this documentation?
      placeholder: |
        Example:
        - Clash Verge Rev installed
        - Mihomo Core
        - Subscription URL
    validations:
      required: false

  - type: textarea
    id: content
    attributes:
      label: Documentation Content
      description: Write the complete documentation.
      placeholder: |
        # Overview

        ## Repository Structure

        ## Step 1

        ## Step 2

        ## Best Practices

        ## Common Problems

        ## FAQ

        ## Conclusion
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Outcome
      description: What should readers be able to do after reading this document?
      placeholder: |
        Example:
        - Understand the repository.
        - Configure DNS.
        - Troubleshoot common problems.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: Related Documentation
      description: List related guides or resources.
      placeholder: |
        - Installation Guide
        - DNS Guide
        - FAQ
        - Performance Guide
    validations:
      required: false

  - type: textarea
    id: changelog
    attributes:
      label: Changelog
      description: Record updates to this documentation.
      placeholder: |
        v1.0
        - Initial version
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I reviewed existing documentation before creating this issue.
          required: true

        - label: The information is accurate and technically correct.
          required: true

        - label: The content follows Markdown formatting.
          required: true

        - label: The documentation is written in a clear and structured manner.
          required: true
