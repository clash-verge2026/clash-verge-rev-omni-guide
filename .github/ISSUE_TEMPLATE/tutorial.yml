name: "🚀 Tutorial"
description: "Create a beginner-friendly tutorial for Clash Verge Rev Omni Guide."
title: "[Tutorial]: "
labels:
  - tutorial

body:
  - type: markdown
    attributes:
      value: |
        ## Tutorial Contribution

        Thank you for contributing to **Clash Verge Rev Omni Guide**.

        Tutorials are designed for beginners. Please keep the instructions simple, clear, and easy to follow.

  - type: input
    id: tutorial_title
    attributes:
      label: Tutorial Title
      description: Enter a short tutorial title.
      placeholder: "Getting Started with Clash Verge Rev"
    validations:
      required: true

  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      description: Select the difficulty level.
      options:
        - Beginner
        - Intermediate
        - Advanced
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Select the target platform.
      options:
        - Windows
        - macOS
        - Linux
        - Cross-platform
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Tutorial Objective
      description: What will users learn after completing this tutorial?
      placeholder: |
        Example:
        Learn how to install Clash Verge Rev, import a subscription, and enable the system proxy.
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: List any prerequisites.
      placeholder: |
        Example:
        - Clash Verge Rev installed
        - Subscription URL
        - Internet connection
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Tutorial Steps
      description: Provide step-by-step instructions.
      placeholder: |
        Step 1

        Step 2

        Step 3

        Step 4
    validations:
      required: true

  - type: textarea
    id: expected_result
    attributes:
      label: Expected Result
      description: Describe what users should see after completing the tutorial.
      placeholder: |
        Example:
        The proxy is enabled and websites are accessible.
    validations:
      required: true

  - type: textarea
    id: common_mistakes
    attributes:
      label: Common Mistakes
      description: List common mistakes and how to avoid them.
      placeholder: |
        Example:
        - Invalid subscription URL
        - TUN Mode not enabled
        - DNS configuration errors
    validations:
      required: false

  - type: textarea
    id: related_guides
    attributes:
      label: Related Documentation
      description: List related guides or documentation.
      placeholder: |
        - Installation Guide
        - DNS Configuration
        - FAQ
        - Troubleshooting
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I tested this tutorial before submitting.
          required: true

        - label: The tutorial is suitable for beginners.
          required: true

        - label: The tutorial is written in Markdown format.
          required: true
