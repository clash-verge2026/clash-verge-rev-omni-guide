name: "🚀 Tutorial"
description: "Create a step-by-step tutorial for Clash Verge Rev Omni Guide."
title: "[Tutorial]: "
labels:
  - tutorial

body:
  - type: markdown
    attributes:
      value: |
        ## Tutorial Contribution

        Thank you for contributing to **Clash Verge Rev Omni Guide**.

        Tutorials should provide step-by-step instructions that help users accomplish a specific task.

  - type: input
    id: tutorial_title
    attributes:
      label: Tutorial Title
      description: Enter a short and descriptive tutorial title.
      placeholder: "Example: Enable TUN Mode on Windows"
    validations:
      required: true

  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      description: Select the difficulty level.
      options:
        - Beginner
        - Intermediate
        - Advanced
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Select the target platform.
      options:
        - Windows
        - macOS
        - Linux
        - Cross-platform
    validations:
      required: true

  - type: input
    id: estimated_time
    attributes:
      label: Estimated Completion Time
      description: Approximately how long does this tutorial take?
      placeholder: "10 minutes"

  - type: textarea
    id: objective
    attributes:
      label: Learning Objective
      description: What will users accomplish after completing this tutorial?
      placeholder: |
        Example:
        - Install Clash Verge Rev
        - Configure DNS
        - Enable TUN Mode
    validations:
      required: true

  - type: textarea
    id: prerequisites
    attributes:
      label: Prerequisites
      description: What should users prepare before starting?
      placeholder: |
        Example:
        - Clash Verge Rev installed
        - Mihomo Core
        - Subscription URL
        - Administrator privileges
    validations:
      required: false

  - type: textarea
    id: tutorial
    attributes:
      label: Tutorial Content
      description: Write the complete tutorial.
      placeholder: |
        # Overview

        ## Step 1

        ## Step 2

        ## Step 3

        ## Step 4

        ## Verification

        ## Common Problems

        ## FAQ
    validations:
      required: true

  - type: textarea
    id: expected_result
    attributes:
      label: Expected Result
      description: What should users achieve after completing this tutorial?
      placeholder: |
        Example:
        - Successfully installed Clash Verge Rev.
        - Imported a subscription.
        - Connected to a proxy server.
    validations:
      required: true

  - type: textarea
    id: next_steps
    attributes:
      label: Next Steps
      description: What should users learn after finishing this tutorial?
      placeholder: |
        Recommended reading:
        - DNS Configuration Guide
        - TUN Mode Guide
        - Performance Optimization
    validations:
      required: false

  - type: textarea
    id: related_docs
    attributes:
      label: Related Documentation
      description: List related documentation or guides.
      placeholder: |
        - Installation Guide
        - Configuration Guide
        - FAQ
        - Troubleshooting Guide
    validations:
      required: false

  - type: textarea
    id: changelog
    attributes:
      label: Changelog
      description: Record updates to this tutorial.
      placeholder: |
        v1.0
        - Initial version
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I tested this tutorial before submitting.
          required: true

        - label: The tutorial is suitable for the selected difficulty level.
          required: true

        - label: The tutorial is written in Markdown format.
          required: true

        - label: The steps are complete and easy to follow.
          required: true
